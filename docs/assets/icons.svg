<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    TBaguette’s Atelier — line-mark sprite.
    Single stroke weight throughout (consumers set stroke-width via the
    shared .icon class in styles.css; these symbols carry no fill/stroke
    styling of their own so they inherit currentColor correctly in both
    themes):
      icon-wheat, icon-crust, icon-grain  — category markers, cycled across
        the ten landing-page category headings. Decorative, not a
        per-category semantic mapping (the content schema carries no such
        mapping) — variety without invented meaning.
      icon-sun, icon-moon                 — theme toggle status.
      icon-search                         — search field affordance.
      icon-copy, icon-check               — install-command copy button,
        default and post-copy state.
      icon-rotate                         — the update modal's Reload
        button. The one glyph here that carries meaning rather than
        flavour: the modal's loaf seal is brand, this is the action.
      icon-graph                          — the header's Graph link and a
        skill page's "see it in the graph" link: four nodes, five ties.
      icon-back                           — the graph's step back out of
        a skill.
      icon-list, icon-route               — the graph's list view and
        its trace-a-path tool.
      icon-plus, icon-minus, icon-fit     — the graph's zoom controls.
    All symbols share a 0 0 24 24 viewBox so they drop in at a consistent
    optical size wherever used.
  -->

  <symbol id="icon-wheat" viewBox="0 0 24 24">
    <path d="M12 21 L12 4" />
    <path d="M12 6.5 L8.25 3.25 M12 6.5 L15.75 3.25" />
    <path d="M12 9.75 L8.25 6.75 M12 9.75 L15.75 6.75" />
    <path d="M12 13 L8.5 10.25 M12 13 L15.5 10.25" />
    <path d="M8.75 17.25 Q12 15.75 15.25 17.25" />
  </symbol>

  <symbol id="icon-crust" viewBox="0 0 24 24">
    <path d="M4 15.5 Q4 7.5 12 6 Q20 7.5 20 15.5 Q20 18.25 12 18.75 Q4 18.25 4 15.5 Z" />
    <path d="M9 8.75 Q9.75 7.25 11 6.75" />
    <path d="M13.75 8.5 Q14.5 7.25 15.5 6.75" />
    <circle cx="9.5" cy="13.5" r="0.9" />
    <circle cx="13" cy="15.25" r="1.1" />
    <circle cx="15.5" cy="12" r="0.7" />
  </symbol>

  <symbol id="icon-grain" viewBox="0 0 24 24">
    <path d="M12 4.75 C16.25 8 16.25 16 12 19.25 C7.75 16 7.75 8 12 4.75 Z" />
    <path d="M12 6.5 L12 17.5" />
  </symbol>

  <symbol id="icon-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4" />
    <path d="M19 12 L21.5 12 M16.95 16.95 L18.68 18.68 M12 19 L12 21.5 M7.05 16.95 L5.32 18.68 M5 12 L2.5 12 M7.05 7.05 L5.32 5.32 M12 5 L12 2.5 M16.95 7.05 L18.68 5.32" />
  </symbol>

  <symbol id="icon-moon" viewBox="0 0 24 24">
    <path d="M15.5 3.5 A 8 8 0 1 0 15.5 20.5 A 6.2 6.2 0 1 1 15.5 3.5 Z" />
  </symbol>

  <symbol id="icon-search" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="6.5" />
    <path d="M15.3 15.3 L20.5 20.5" />
  </symbol>

  <symbol id="icon-copy" viewBox="0 0 24 24">
    <rect x="8.5" y="8.5" width="11" height="11" rx="2" />
    <path d="M15.5 8.5 V6.5 A2 2 0 0 0 13.5 4.5 H6.5 A2 2 0 0 0 4.5 6.5 V13.5 A2 2 0 0 0 6.5 15.5 H8.5" />
  </symbol>

  <symbol id="icon-check" viewBox="0 0 24 24">
    <path d="M5 12.5 L10 17.5 L19 6.5" />
  </symbol>

  <!-- The arc runs three-quarters of the circle and then keeps going, out of
       the circle, to land exactly on the corner of the arrowhead bracket. The
       two subpaths meeting at one shared point (19.5 8) is what makes this
       read as a single continuous arrow rather than an arc with a chevron
       parked near it. -->
  <symbol id="icon-rotate" viewBox="0 0 24 24">
    <path d="M20 12 A8 8 0 1 1 12 4 C14.24 4 16.38 4.94 17.93 6.4 L19.5 8" />
    <path d="M19.5 3.5 L19.5 8 L15 8" />
  </symbol>

  <!-- Four nodes, five ties: one of them crosses, so it reads as a network
       rather than a polygon. The nodes are rings, not dots, so the mark has
       the same single-stroke weight as every other symbol here. -->
  <symbol id="icon-graph" viewBox="0 0 24 24">
    <circle cx="6" cy="7" r="2.25" />
    <circle cx="18" cy="5.5" r="2.25" />
    <circle cx="17" cy="18" r="2.25" />
    <circle cx="6.5" cy="17.5" r="2.25" />
    <path d="M8.2 6.6 L15.8 5.9 M6.1 9.25 L6.4 15.25 M8.75 17.6 L14.75 17.9 M17.8 7.75 L17.2 15.75 M7.7 8.8 L15.4 16.3" />
  </symbol>



  <symbol id="icon-back" viewBox="0 0 24 24">
    <path d="M19 12 H5.5 M11 6 L5 12 L11 18" />
  </symbol>


  <symbol id="icon-list" viewBox="0 0 24 24">
    <path d="M9 6.5 H19.5 M9 12 H19.5 M9 17.5 H19.5" />
    <circle cx="5" cy="6.5" r="0.9" />
    <circle cx="5" cy="12" r="0.9" />
    <circle cx="5" cy="17.5" r="0.9" />
  </symbol>

  <!-- Two stops and the way between them, bent twice: the trace-a-path tool
       finds a route through the citations, not a straight line. -->
  <symbol id="icon-route" viewBox="0 0 24 24">
    <circle cx="5.5" cy="18.5" r="2" />
    <circle cx="18.5" cy="5.5" r="2" />
    <path d="M7.5 18.5 H13.5 A3 3 0 0 0 13.5 12.5 H10.5 A3 3 0 0 1 10.5 6.5 H16.5" />
  </symbol>

  <symbol id="icon-plus" viewBox="0 0 24 24">
    <path d="M12 5.5 V18.5 M5.5 12 H18.5" />
  </symbol>

  <symbol id="icon-minus" viewBox="0 0 24 24">
    <path d="M5.5 12 H18.5" />
  </symbol>

  <symbol id="icon-fit" viewBox="0 0 24 24">
    <path d="M4.5 9 V4.5 H9 M15 4.5 H19.5 V9 M19.5 15 V19.5 H15 M9 19.5 H4.5 V15" />
    <circle cx="12" cy="12" r="2.5" />
  </symbol>
</svg>
